global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: ai
    static_configs: [{ targets: ["ai:8090"] }]
  - job_name: stream-gateway
    static_configs: [{ targets: ["stream-gateway:7090"] }]
  - job_name: feed-simulator
    static_configs: [{ targets: ["feed-simulator:9101"] }]
  - job_name: tick-aggregator
    static_configs: [{ targets: ["tick-aggregator:9102"] }]
  - job_name: alert-engine
    static_configs: [{ targets: ["alert-engine:9104"] }]
  - job_name: notifier
    static_configs: [{ targets: ["notifier:9105"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
