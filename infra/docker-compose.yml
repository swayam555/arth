name: arth

x-restart: &restart
  restart: unless-stopped

x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}

services:
  postgres:
    <<: *restart
    image: timescale/timescaledb:2.32.0-pg17
    profiles: [core, realtime, ai, obs]
    environment:
      POSTGRES_DB: arth
      POSTGRES_USER: arth
      POSTGRES_PASSWORD: arth
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "timescaledb.telemetry_level=off"]
    ports: ["7432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arth -d arth"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:8.8.4-alpine
    profiles: [core, realtime, ai, obs]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["7379:6379"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *restart
    image: apache/kafka:4.3.2
    profiles: [core, realtime, ai, obs]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:7092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:7092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports: ["7092:7092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: arth/api:dev
    profiles: [core, realtime, ai, obs]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/arth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-dev-only-x}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      OTEL_EXPORT: ${OTEL_EXPORT:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_ENDPOINT:-http://jaeger:4318}/v1/traces
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  feed-simulator:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args: { SERVICE: feed-simulator, EXTERNALS: "@platformatic/kafka" }
    image: arth/feed-simulator:dev
    profiles: [realtime, ai, obs]
    environment:
      KAFKA_BROKERS: kafka:9092
      TICK_RATE: ${TICK_RATE:-2500}
      <<: *telemetry
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 160m

  backfill:
    image: arth/feed-simulator:dev
    profiles: [realtime, ai, obs]
    command: ["node", "backfill.js"]
    environment:
      DATABASE_URL: postgres://arth:arth@postgres:5432/arth
    depends_on:
      api: { condition: service_healthy }
      feed-simulator: { condition: service_started }
    restart: "no"
    mem_limit: 256m

  tick-aggregator:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args: { SERVICE: tick-aggregator, EXTERNALS: "@platformatic/kafka" }
    image: arth/tick-aggregator:dev
    profiles: [realtime, ai, obs]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://arth:arth@postgres:5432/arth
      <<: *telemetry
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    mem_limit: 192m

  alert-engine:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args: { SERVICE: alert-engine, EXTERNALS: "@platformatic/kafka" }
    image: arth/alert-engine:dev
    profiles: [realtime, ai, obs]
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://arth:arth@postgres:5432/arth
      COOLDOWN_SEC: ${ALERT_COOLDOWN_SEC:-900}
      <<: *telemetry
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    mem_limit: 160m

  notifier:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args: { SERVICE: notifier, EXTERNALS: "@platformatic/kafka" }
    image: arth/notifier:dev
    profiles: [realtime, ai, obs]
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://arth:arth@postgres:5432/arth
      PUSH_SENDER: ${PUSH_SENDER:-log}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      <<: *telemetry
    depends_on:
      kafka: { condition: service_healthy }
      api: { condition: service_healthy }
    mem_limit: 128m

  stream-gateway:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/node-service.Dockerfile
      args: { SERVICE: stream-gateway, EXTERNALS: "uWebSockets.js" }
    image: arth/stream-gateway:dev
    profiles: [realtime, ai, obs]
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      <<: *telemetry
    ports: ["7090:7090"]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7090/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  ai:
    <<: *restart
    build:
      context: ../services/ai
    image: arth/ai:dev
    profiles: [ai, obs]
    environment:
      DATABASE_URL: postgresql://arth:arth@postgres:5432/arth
      REDIS_URL: redis://redis:6379
      ARTH_API_URL: http://api:8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-dev-only-x}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDER: ${EMBEDDER:-hashing}
      NEWS_FEED_URLS: ${NEWS_FEED_URLS:-}
      KAFKA_BROKERS: kafka:9092
      DIGEST_SCHEDULER: ${DIGEST_SCHEDULER:-on}
      <<: *telemetry
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      api: { condition: service_healthy }
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/readyz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  certs:
    image: alpine/openssl:3.5.9
    profiles: [core, realtime, ai, obs]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        [ -f /certs/arth.crt ] ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN=arth.local"
        -addext "subjectAltName=DNS:localhost,DNS:arth.local,IP:127.0.0.1,IP:10.0.2.2"
        -keyout /certs/arth.key -out /certs/arth.crt
    volumes: [certs:/certs]

  nginx:
    <<: *restart
    image: nginx:1.31.8-alpine
    profiles: [core, realtime, ai, obs]
    ports: ["7080:80", "7443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/well-known:/etc/nginx/static/.well-known:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certs: { condition: service_completed_successfully }
      api: { condition: service_started }
    mem_limit: 64m

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--storage.tsdb.path=/prometheus"]
    ports: ["7909:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 256m

  grafana:
    <<: *restart
    image: grafana/grafana:13.2.6
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-arth}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/arth.json
    ports: ["7300:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    mem_limit: 192m

  jaeger:
    <<: *restart
    image: jaegertracing/jaeger:2.23.0
    profiles: [obs]
    ports: ["7686:16686", "4317:4317", "4318:4318"]
    mem_limit: 256m

volumes:
  pgdata:
  kafkadata:
  certs:
  promdata:
