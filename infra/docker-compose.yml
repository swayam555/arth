name: arth

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: timescale/timescaledb:2.32.0-pg17
    profiles: [core, realtime, ai, obs]
    environment:
      POSTGRES_DB: arth
      POSTGRES_USER: arth
      POSTGRES_PASSWORD: arth
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "timescaledb.telemetry_level=off"]
    ports: ["7432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arth -d arth"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:8.8.4-alpine
    profiles: [core, realtime, ai, obs]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["7379:6379"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *restart
    image: apache/kafka:4.3.2
    profiles: [core, realtime, ai, obs]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:7092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:7092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports: ["7092:7092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: arth/api:dev
    profiles: [core, realtime, ai, obs]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/arth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-internal-secret-change-me-dev-only-x}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  certs:
    image: alpine/openssl:3.5.9
    profiles: [core, realtime, ai, obs]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        [ -f /certs/arth.crt ] ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN=arth.local"
        -addext "subjectAltName=DNS:localhost,DNS:arth.local,IP:127.0.0.1,IP:10.0.2.2"
        -keyout /certs/arth.key -out /certs/arth.crt
    volumes: [certs:/certs]

  nginx:
    <<: *restart
    image: nginx:1.31.8-alpine
    profiles: [core, realtime, ai, obs]
    ports: ["7080:80", "7443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certs: { condition: service_completed_successfully }
      api: { condition: service_started }
    mem_limit: 64m

volumes:
  pgdata:
  kafkadata:
  certs:
