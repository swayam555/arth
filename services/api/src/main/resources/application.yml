spring:
  application:
    name: api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:7432/arth}
    username: ${DB_USER:arth}
    password: ${DB_PASSWORD:arth}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:7379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:7092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

arth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    internal-secret: ${INTERNAL_JWT_SECRET:dev-only-internal-secret-change-me-dev-only-x}
    access-ttl: 15m
    refresh-ttl: 30d
    issuer: arth-api
  otp:
    provider: ${OTP_PROVIDER:log}
    fixed-code: ${OTP_FIXED_CODE:}
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 30s
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:120}
    refill-per-second: ${RATE_LIMIT_REFILL:20}
