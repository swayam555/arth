[project]
name = "arth-ai"
version = "0.5.0"
description = "Arth AI copilot: grounded, compliance-guarded portfolio Q&A over the Arth api"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "anthropic",
    "httpx",
    "pydantic",
    "asyncpg",
    "redis",
    "pyjwt",
    "alembic",
    "sqlalchemy",
    "psycopg[binary]",
    "prometheus-client",
    "python-multipart",
    "aiokafka>=0.15.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
packages = ["arth_ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arth_ai"]
