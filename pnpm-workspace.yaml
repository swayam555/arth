nodeLinker: hoisted

packages:
  - apps/*
  - packages/*
  - services/feed-simulator
  - services/tick-aggregator
  - services/stream-gateway
  - services/alert-engine
  - services/notifier

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  '@bufbuild/buf': true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@sentry/bundler-plugins@11.15.0'
  - '@sentry/core@11.15.0'
  - '@sentry/node@11.15.0'
  - '@sentry/opentelemetry@11.15.0'
  - '@sentry/server-runtime-injection@11.15.0'
  - '@sentry/server-utils@11.15.0'
